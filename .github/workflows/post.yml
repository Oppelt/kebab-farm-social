name: Kebab Farm posten

on:
  schedule:
    # 3 Clips am Tag: Termine 11, 16 und 20 Uhr UTC = 12, 17 und 21 Uhr Winterzeit (Sommerzeit +1 h).
    # GitHub lässt geplante Läufe manchmal ganz ausfallen (02.11.2026: alle Termine). Darum startet zusätzlich
    # der externe Wecker cron-job.org den Workflow per API (workflow_dispatch mit slot=true) um :05.
    # → Start bei :07, plus stündlicher Ersatz-Lauf 11–23 Uhr UTC. Mit --slot postet jeder Termin nur einmal.
    # Wichtig: Commits an dieser Datei mit der GitHub-noreply-Adresse machen (siehe git config user.email im Repo),
    # sonst ordnet GitHub den Zeitplan keinem Konto zu.
    # Termine müssen zu config.json → slotsUtc passen.
    - cron: "7 11 * * *"
    - cron: "7 16 * * *"
    - cron: "7 20 * * *"
    - cron: "37 11-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Probelauf (nichts posten)"
        type: boolean
        default: false
      slot:
        description: "Wie ein Termin-Lauf: nur posten, wenn der aktuelle Termin noch offen ist (für den externen Wecker cron-job.org)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # immer der neueste Stand, damit ein wartender Lauf sieht, was der vorige gepostet hat

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Posten
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post.js ${{ inputs.dry_run && '--dry-run' || '' }} ${{ (github.event_name == 'schedule' || inputs.slot) && '--slot' || '' }}

      - name: Stand speichern
        if: always() && !inputs.dry_run
        run: |
          git config user.name "kebab-farm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json state
          if ! git diff --cached --quiet; then
            git commit -q -m "Gepostet: $(date -u +%F)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi

      - name: Gepostete Videos aus GitHub Pages entfernen
        if: always() && !inputs.dry_run
        run: |
          git config user.name "kebab-farm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/prune-pages.js
